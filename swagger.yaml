openapi: 3.0.3
info:
  title: Inventory & Sales Management API
  description: >
    API for managing users, authentication, products, categories, suppliers,
    purchase orders, sales orders, and inventory audit logs.
  version: 1.0.0

servers:
  - url: http://localhost:7070
    description: Local development server

tags:
  - name: Auth
    description: User authentication and token management
  - name: Users
    description: Operations related to managing system users
  - name: Products
    description: Catalog management and stock profiles
  - name: Categories
    description: Groupings and sorting for product taxonomies
  - name: Suppliers
    description: Vendor profiles and business contact data
  - name: Purchase Orders
    description: Inbound stock orders from suppliers (Procurement)
  - name: Sales Orders
    description: Outbound fulfillments to customers (Revenue generation)
  - name: Inventory / Audit
    description: Stock adjustments, logs, and dashboard metrics

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new system user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid data or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate a user and get a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/change-password:
    post:
      tags:
        - Auth
      summary: Change password for the logged-in user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Password updated successfully
        '401':
          description: Unauthorized
        '400':
          description: Incorrect legacy password or validation failure

  /users:
    get:
      tags:
        - Users
      summary: List all users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /products:
    get:
      tags:
        - Products
      summary: Fetch catalog products
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags:
        - Products
      summary: Create a product line
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags:
        - Products
      summary: Get details of a single product
      responses:
        '200':
          description: Match found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: SKU/ID context not found
    put:
      tags:
        - Products
      summary: Update a product configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Update structural changes committed
    delete:
      tags:
        - Products
      summary: Remove a product catalog structure
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Product successfully dropped

  /categories:
    get:
      tags:
        - Categories
      summary: List all product categories
      responses:
        '200':
          description: Array of items returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags:
        - Categories
      summary: Define a new structural classification category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category setup complete

  /suppliers:
    get:
      tags:
        - Suppliers
      summary: Get suppliers registry
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
    post:
      tags:
        - Suppliers
      summary: Onboard a new supplier profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInput'
      responses:
        '201':
          description: Vendor documented

  /purchase-orders:
    get:
      tags:
        - Purchase Orders
      summary: Review historical inbound supplier orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'
    post:
      tags:
        - Purchase Orders
      summary: Initialize a new procurement purchase order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '201':
          description: PO processing state initialized

  /purchase-orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Purchase Orders
      summary: Modify the lifecycle status of a purchase order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderStatusInput'
      responses:
        '200':
          description: Status successfully modified

  /sales-orders:
    get:
      tags:
        - Sales Orders
      summary: Query customer sales invoices and orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Record history array returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesOrder'
    post:
      tags:
        - Sales Orders
      summary: Log a new sales record out of current inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderInput'
      responses:
        '201':
          description: Transaction compiled and stock drawn

  /sales-orders/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Sales Orders
      summary: Transition operational lifecycle status of a sales order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderStatusInput'
      responses:
        '200':
          description: Step workflow updated

  /inventory/adjust:
    post:
      tags:
        - Inventory / Audit
      summary: Record manual operational adjustments or balances
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentInput'
      responses:
        '200':
          description: Discrepancies calculated and logs generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementLog'

  /inventory/logs:
    get:
      tags:
        - Inventory / Audit
      summary: Extract structural log records of all system stock changes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit history log streams matched
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovementLog'

  /inventory/dashboard-summary:
    get:
      tags:
        - Inventory / Audit
      summary: Fetch multi-metric metrics for system status overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Operational health calculations parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Role:
      type: string
      enum: [ADMIN, MANAGER, STAFF]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    ChangePasswordInput:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        price:
          type: number
          format: float
        costPrice:
          type: number
          format: float
        quantityInStock:
          type: integer
        reorderLevel:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required: [sku, name]
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        price:
          type: number
        costPrice:
          type: number
        quantityInStock:
          type: integer
        reorderLevel:
          type: integer

    Supplier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        contactName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    SupplierInput:
      type: object
      required: [companyName]
      properties:
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string

    PurchaseOrderItemInput:
      type: object
      required: [productId, quantityOrdered, unitCost]
      properties:
        productId:
          type: string
          format: uuid
        quantityOrdered:
          type: integer
        unitCost:
          type: number

    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        orderDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [Pending, Ordered, Received, Cancelled]
        totalAmount:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItemInput'

    PurchaseOrderInput:
      type: object
      required: [supplierId, items]
      properties:
        supplierId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItemInput'

    PurchaseOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Pending, Ordered, Received, Cancelled]

    SalesOrderItemInput:
      type: object
      required: [productId, quantitySold, unitPrice]
      properties:
        productId:
          type: string
          format: uuid
        quantitySold:
          type: integer
        unitPrice:
          type: number

    SalesOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
          nullable: true
        orderDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [Processing, Shipped, Delivered, Cancelled]
        totalAmount:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItemInput'

    SalesOrderInput:
      type: object
      required: [items]
      properties:
        customerName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SalesOrderItemInput'

    SalesOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Processing, Shipped, Delivered, Cancelled]

    StockMovementLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        quantityChanged:
          type: integer
        reason:
          type: string
        loggedAt:
          type: string
          format: date-time

    StockAdjustmentInput:
      type: object
      required: [productId, quantityChanged, reason]
      properties:
        productId:
          type: string
          format: uuid
        quantityChanged:
          type: integer
          description: Positive for additions, negative for reductions
        reason:
          type: string
          example: Damaged

    DashboardSummary:
      type: object
      properties:
        metrics:
          type: object
          properties:
            totalProducts:
              type: integer
            totalCategories:
              type: integer
            totalSuppliers:
              type: integer
            lowStockAlerts:
              type: integer
            totalRevenue:
              type: number
            totalProcurementCost:
              type: number

    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
